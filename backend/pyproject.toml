[project]
name = "memory-agent-backend"
version = "0.1.0"
description = "A memory-driven Agent demo built with LangChain and LangGraph"
requires-python = ">=3.10,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

